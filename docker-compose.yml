services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ravannama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ravannama_local_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-ravannama}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local_dev}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_local_dev}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-ravannama-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-ravannama-private}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && \
        mc mb --ignore-existing "local/$$S3_PUBLIC_BUCKET" && \
        mc anonymous set download "local/$$S3_PUBLIC_BUCKET" && \
        mc mb --ignore-existing "local/$$S3_PRIVATE_BUCKET" && \
        mc anonymous set none "local/$$S3_PRIVATE_BUCKET"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://ravannama:ravannama_local_dev_pw@postgres:5432/ravannama?sslmode=disable}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-ir-thr-at1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_local_dev}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-ravannama-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-ravannama-private}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-ravannama.ir}
      OTP_PEPPER: ${OTP_PEPPER:-local-dev-otp-pepper-change-in-prod-32b}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-ravannama.ir}
      INTERNAL_API_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    depends_on:
      - api
      - web
    environment:
      CADDY_ASK_URL: ${CADDY_ASK_URL:-http://api:8080/internal/tls/allow}
    ports:
      - "127.0.0.1:${CADDY_HTTP_PORT:-8088}:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
